{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Official feedback" %} &mdash; {{ block.super }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <p>
        <a href="{% url 'a4moderation:project' project.pk %}?state={{ state }}&content_type={{ content_type }}&ordering={{ ordering }}">
            <i class="fa fa-chevron-left" aria-hidden="true"></i>
            {% translate "Back to moderation" %}
        </a>
    </p>
    <p class="u-text--gray">{{ project.name }}</p>
    {% include "a4moderation/includes/feedback_form.html" %}
</div>
{% endblock %}
