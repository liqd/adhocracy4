{% load i18n %}
{% if items %}
    <ul class="actionable-list moderation-list">
        {% for item in items %}
            {% include "a4moderation/includes/moderation_item.html" %}
        {% endfor %}
    </ul>
    {% include "a4moderation/includes/pagination.html" %}
{% else %}
    <p class="moderation-empty">{% translate "There are no contributions matching your filter." %}</p>
{% endif %}
